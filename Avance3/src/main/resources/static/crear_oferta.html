<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear oferta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="vista/theme.css" rel="stylesheet">
</head>

<body class="d-flex flex-column vh-100">

    <!-- Menu de navegacion (se carga desde navbar.html) -->
    <header id="navbar-contenedor"></header>

    <div class="d-flex flex-nowrap flex-grow-1 overflow-hidden">

        <!-- Menu Lateral (se carga desde sidebar.html) -->
        <div id="sidebar-contenedor"></div>

        <!-- Area principal -->
        <main class="flex-grow-1 p-4 overflow-auto d-flex flex-column">

            <div id="mensaje" class="alert d-none" role="alert"></div>

            <form id="formOferta" class="container-fluid p-0 d-flex flex-column flex-grow-1" novalidate>
                <div class="row g-4 flex-grow-1">

                    <!-- Datos de la oferta -->
                    <div class="col-12 col-lg-8">
                        <div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden">

                            <div class="p-3 card-header-custom fw-medium">
                                Crear oferta
                            </div>

                            <div class="card-body p-4">

                                <div class="row g-4">

                                    <!-- Puesto -->
                                    <div class="col-12">
                                        <div class="p-4 border rounded shadow-sm bg-light h-100">
                                            <h5 class="fw-bold text-custom-primary mb-3">Información del puesto</h5>
                                            <label for="puesto" class="form-label">Puesto</label>
                                            <input type="text" class="form-control" id="puesto" maxlength="100"
                                                placeholder="Ej: Practicante de Desarrollo de Software" required>
                                        </div>
                                    </div>

                                    <!-- Remuneracion -->
                                    <div class="col-12 col-md-6">
                                        <div class="p-4 border rounded shadow-sm bg-light h-100">
                                            <h5 class="fw-bold text-custom-primary mb-3">Remuneración</h5>
                                            <div class="row g-3">
                                                <div class="col-12 col-sm-6">
                                                    <label for="sueldo" class="form-label">Sueldo (S/)</label>
                                                    <input type="number" class="form-control" id="sueldo" min="0.01"
                                                        max="99999999.99" step="0.01" required>
                                                </div>
                                                <div class="col-12 col-sm-6">
                                                    <label for="frecuenciaPagos" class="form-label">Frecuencia de
                                                        pagos</label>
                                                    <select class="form-select" id="frecuenciaPagos" required>
                                                        <option value="" selected disabled>Selecciona</option>
                                                        <option value="Semanal">Semanal</option>
                                                        <option value="Quincenal">Quincenal</option>
                                                        <option value="Mensual">Mensual</option>
                                                    </select>
                                                </div>
                                                <div class="col-12 col-sm-6">
                                                    <label for="bonos" class="form-label">Bonos (S/)</label>
                                                    <input type="number" class="form-control" id="bonos" min="0"
                                                        max="99999999.99" step="0.01" value="0">
                                                </div>
                                                <div class="col-12 col-sm-6">
                                                    <label for="horas" class="form-label">Horas semanales</label>
                                                    <input type="number" class="form-control" id="horas" min="1"
                                                        max="168" step="1" required>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Beneficios -->
                                    <div class="col-12 col-md-6">
                                        <div class="p-4 border rounded shadow-sm bg-light h-100">
                                            <h5 class="fw-bold text-custom-primary mb-3">Beneficios</h5>
                                            <div class="row g-3">
                                                <div class="col-12 col-sm-6">
                                                    <label for="vacaciones" class="form-label">Vacaciones (días)</label>
                                                    <input type="number" class="form-control" id="vacaciones" min="0"
                                                        max="365" step="1" required>
                                                </div>
                                                <div class="col-12 col-sm-6">
                                                    <label for="seguroVida" class="form-label">Seguro de vida</label>
                                                    <select class="form-select" id="seguroVida" required>
                                                        <option value="" selected disabled>Selecciona</option>
                                                        <option value="Sí">Sí</option>
                                                        <option value="No">No</option>
                                                    </select>
                                                </div>
                                                <div class="col-12">
                                                    <label for="gratificaciones" class="form-label">Gratificaciones
                                                        <span class="text-muted">(opcional)</span></label>
                                                    <input type="text" class="form-control" id="gratificaciones"
                                                        maxlength="100" placeholder="Ej: Julio y diciembre">
                                                </div>
                                                <div class="col-12">
                                                    <label for="otros" class="form-label">Otros beneficios
                                                        <span class="text-muted">(opcional)</span></label>
                                                    <input type="text" class="form-control" id="otros" maxlength="255"
                                                        placeholder="Ej: Movilidad, almuerzo, capacitaciones">
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Vigencia -->
                                    <div class="col-12">
                                        <div class="p-4 border rounded shadow-sm bg-light h-100">
                                            <h5 class="fw-bold text-custom-primary mb-3">Vigencia de la oferta</h5>
                                            <div class="row g-3">
                                                <div class="col-12 col-sm-6">
                                                    <label for="fechaInicio" class="form-label">Fecha de inicio</label>
                                                    <input type="date" class="form-control" id="fechaInicio" required>
                                                </div>
                                                <div class="col-12 col-sm-6">
                                                    <label for="fechaFin" class="form-label">Fecha de fin</label>
                                                    <input type="date" class="form-control" id="fechaFin" required>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                <div class="mt-4 d-flex justify-content-end">
                                    <button type="submit" class="btn btn-custom-primary rounded-3 px-5 py-2 fw-medium shadow-sm"
                                        id="btnCrearOferta">
                                        Crear oferta
                                    </button>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- Requisitos (se llena desde crear_oferta.js) -->
                    <div class="col-12 col-lg-4">
                        <div class="card border-0 shadow-sm rounded-4 h-100 d-flex flex-column overflow-hidden">

                            <div class="p-3 card-header-custom fw-medium d-flex justify-content-between align-items-center">
                                <span>Requisitos</span>
                                <span class="badge bg-light text-dark" id="totalSeleccionados">0</span>
                            </div>

                            <div class="card-body p-4 overflow-auto">
                                <p class="text-secondary small">Selecciona los requisitos que deben cumplir los
                                    postulantes.</p>
                                <div class="d-flex flex-column gap-3" id="listaRequisitos">
                                    <span class="text-secondary">Cargando requisitos...</span>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </form>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="controlador/app.js"></script>
    <script src="controlador/crear_oferta.js"></script>
</body>

</html>
