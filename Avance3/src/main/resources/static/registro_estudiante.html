<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="vista/registro_estudiante.css">
    <link rel="icon" href="img/logo_empleate.jpg">
</head>

<body>
    <div class="cuadro_registro">
        <h1 class="text-center">Crear cuenta de estudiante</h1>

        <form id="formRegistro" novalidate>
            <div class="row g-3">
                <div class="col-12">
                    <label for="nombreEstudiante" class="form-label">Nombres</label>
                    <input type="text" class="form-control" id="nombreEstudiante" maxlength="100" required>
                </div>
                <div class="col-md-6">
                    <label for="apellidoPEstudiante" class="form-label">Apellido paterno</label>
                    <input type="text" class="form-control" id="apellidoPEstudiante" maxlength="100" required>
                </div>
                <div class="col-md-6">
                    <label for="apellidoMEstudiante" class="form-label">Apellido materno</label>
                    <input type="text" class="form-control" id="apellidoMEstudiante" maxlength="100" required>
                </div>
                <div class="col-md-6">
                    <label for="dni" class="form-label">DNI</label>
                    <input type="text" class="form-control" id="dni" maxlength="8" inputmode="numeric"
                        pattern="\d{8}" required>
                </div>
                <div class="col-md-6">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" maxlength="15" inputmode="numeric"
                        pattern="\d{7,15}" required>
                </div>
                <div class="col-12">
                    <label for="correo" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="correo" maxlength="150" required>
                </div>
                <div class="col-12">
                    <label for="nivelEducativo" class="form-label">Nivel educativo</label>
                    <select class="form-select" id="nivelEducativo" required>
                        <option value="" selected disabled>Selecciona una opción</option>
                        <option>Secundaria completa</option>
                        <option>Técnico (en curso)</option>
                        <option>Técnico (egresado)</option>
                        <option>Universitario (en curso)</option>
                        <option>Universitario (egresado)</option>
                        <option>Bachiller</option>
                        <option>Titulado</option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcion" rows="3"
                        placeholder="Cuéntanos brevemente sobre ti" required></textarea>
                </div>
                <div class="col-md-6">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" minlength="6" required>
                </div>
                <div class="col-md-6">
                    <label for="confirmarContrasena" class="form-label">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="confirmarContrasena" minlength="6" required>
                </div>
            </div>

            <div id="mensaje" class="alert d-none mt-4 mb-0" role="alert"></div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary" id="btnRegistrar">Crear cuenta</button>
                <p class="enlace-sesion">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
            </div>
        </form>
    </div>

    <script src="controlador/registro_estudiante.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
