<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="vista/theme.css" rel="stylesheet">
</head>

<body class="d-flex flex-column vh-100">

    <!-- Menu de navegacion (se carga desde navbar.html) -->
    <header id="navbar-contenedor"></header>

    <div class="d-flex flex-nowrap flex-grow-1 overflow-hidden">

        <!-- Menu Lateral (se carga desde sidebar.html) -->
        <div id="sidebar-contenedor"></div>

        <!-- Area Principal -->
        <main class="flex-grow-1 p-4 overflow-auto">

            <a href="mis-vacantes.html" class="text-decoration-none text-custom-primary">&larr; Volver a mis vacantes</a>

            <!-- Encabezado -->
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 my-3">
                <div class="d-flex align-items-center gap-2">
                    <h4 class="fw-bold mb-0" id="titulo">Postulantes</h4>
                    <span class="badge d-none" id="estadoOferta"></span>
                </div>
                <div class="d-flex flex-wrap gap-2" id="resumen"></div>
            </div>

            <div id="mensaje" class="alert d-none" role="alert"></div>

            <!-- Tabla de postulantes -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr class="card-header-custom">
                                    <th>Postulante</th>
                                    <th>Correo</th>
                                    <th>Nivel educativo</th>
                                    <th>Postuló el</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>

                            <!-- Se llena desde postulantes.js -->
                            <tbody id="tablaPostulantes">
                                <tr>
                                    <td colspan="6" class="text-center text-secondary py-4">Cargando postulantes...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- Información del postulante -->
    <div class="modal fade" id="modalInfo" tabindex="-1" aria-labelledby="modalInfoTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header card-header-custom">
                    <h1 class="modal-title fs-5" id="modalInfoTitulo">Información del postulante</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="modalInfoCuerpo"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary me-auto" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-danger d-none" id="btnRechazarInfo">Rechazar</button>
                    <button type="button" class="btn btn-success d-none" id="btnAceptarInfo">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmar el cambio de estado (no se puede deshacer) -->
    <div class="modal fade" id="modalConfirmar" tabindex="-1" aria-labelledby="modalConfirmarTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalConfirmarTitulo">Confirmar decisión</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2" id="confirmarTexto"></p>
                    <p class="text-danger small mb-0">Una vez aceptada o rechazada, la postulación ya no se podrá
                        cambiar.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn" id="btnConfirmar">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="controlador/app.js"></script>
    <script src="controlador/postulantes.js"></script>
</body>

</html>
