<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="vista/theme.css" rel="stylesheet">
</head>

<body class="d-flex flex-column vh-100">

    <!-- Menu de navegacion (se carga desde navbar.html) -->
    <header id="navbar-contenedor"></header>

    <div class="d-flex flex-nowrap flex-grow-1 overflow-hidden">

        <!-- Menu Lateral (se carga desde sidebar.html) -->
        <div id="sidebar-contenedor"></div>

        <!-- Area principal -->
        <main class="flex-grow-1 p-4 overflow-auto d-flex flex-column">

            <div id="mensajeError" class="alert alert-danger d-none" role="alert"></div>

            <div class="container-fluid p-0 d-flex flex-column flex-grow-1">
                <div class="row g-4 flex-grow-1">

                    <!-- Perfil Empresa -->
                    <div class="col-12 col-lg-8">
                        <div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden">

                            <!-- Banner de perfil -->
                            <img src="img/Prueba.png" alt="" class="w-100 bg-custom-primary"
                                style="height: 220px; object-fit: cover;">

                            <div class="card-body px-4 pb-5">

                                <!-- Logo -->
                                <div style="margin-top: -100px; margin-bottom: 20px;">
                                    <img src="img/logo.png" alt="Logo de la empresa"
                                        class="rounded-circle shadow-sm bg-custom-primary"
                                        style="width: 160px; height: 160px; object-fit: cover; border: 6px solid rgb(var(--color-blanco));">
                                </div>

                                <!-- Nombre y rubro -->
                                <h4 class="fw-bold mb-1" id="empresaNombre">Cargando...</h4>
                                <p class="text-secondary mb-4" id="empresaRubro"></p>

                                <div class="row g-4">

                                    <!-- Datos de la empresa -->
                                    <div class="col-12 col-md-6">
                                        <div class="p-4 border rounded shadow-sm bg-light h-100">
                                            <h5 class="fw-bold text-custom-primary mb-3">Datos de la empresa</h5>
                                            <ul class="list-unstyled text-secondary mb-0" style="line-height: 2;">
                                                <li><strong>Nombre:</strong> <span id="datoNombre"></span></li>
                                                <li><strong>Rubro:</strong> <span id="datoRubro"></span></li>
                                                <li><strong>RUC:</strong> <span id="datoRuc"></span></li>
                                            </ul>
                                        </div>
                                    </div>

                                    <!-- Informacion de contacto -->
                                    <div class="col-12 col-md-6">
                                        <div class="p-4 border rounded shadow-sm bg-light h-100">
                                            <h5 class="fw-bold text-custom-primary mb-3">Información de contacto</h5>
                                            <ul class="list-unstyled text-secondary mb-0" style="line-height: 2;">
                                                <li><strong>Teléfono:</strong> <span id="datoTelefono"></span></li>
                                                <li><strong>Correo:</strong> <span id="datoCorreo"></span></li>
                                                <li><strong>Redes sociales:</strong> <span id="datoRedes"></span></li>
                                            </ul>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Usuarios de la empresa -->
                    <div class="col-12 col-lg-4">
                        <div class="card border-0 shadow-sm rounded-4 h-100 d-flex flex-column overflow-hidden">

                            <div class="p-3 card-header-custom fw-medium d-flex justify-content-between align-items-center">
                                <span>Usuarios de la empresa</span>
                                <span class="badge bg-light text-dark" id="totalUsuarios">0</span>
                            </div>

                            <!-- Se llena desde perfil.js -->
                            <div class="card-body d-flex flex-column gap-4 p-4 overflow-auto" id="listaUsuarios"></div>

                        </div>
                    </div>

                </div>
            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="controlador/app.js"></script>
    <script src="controlador/perfil.js"></script>
</body>

</html>
