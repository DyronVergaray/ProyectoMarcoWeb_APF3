<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis vacantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="vista/theme.css" rel="stylesheet">
</head>

<body class="d-flex flex-column vh-100">

    <!-- Menu de navegacion (se carga desde navbar.html) -->
    <header id="navbar-contenedor"></header>

    <div class="d-flex flex-nowrap flex-grow-1 overflow-hidden">

        <!-- Menu Lateral (se carga desde sidebar.html) -->
        <div id="sidebar-contenedor"></div>

        <!-- Area Principal -->
        <main class="flex-grow-1 p-4 overflow-auto">

            <!-- Encabezado de Vacantes -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Mis vacantes</h4>
                <a href="crear_oferta.html" class="btn btn-custom-primary shadow-sm rounded-2">Crear oferta</a>
            </div>

            <div id="mensaje" class="alert d-none" role="alert"></div>

            <!-- Tabla de vacantes -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr class="card-header-custom">
                                    <th>Puesto</th>
                                    <th>Sueldo</th>
                                    <th>Horas/semana</th>
                                    <th>Inicio</th>
                                    <th>Fin</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>

                            <!-- Se llena desde mis_vacantes.js -->
                            <tbody id="tablaVacantes">
                                <tr>
                                    <td colspan="7" class="text-center text-secondary py-4">Cargando vacantes...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- Modificar oferta (se llena desde mis_vacantes.js) -->
    <div class="modal fade" id="modalModificar" tabindex="-1" aria-labelledby="modalModificarTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
            <div class="modal-content">
                <div class="modal-header card-header-custom">
                    <h1 class="modal-title fs-5" id="modalModificarTitulo">Modificar oferta</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <div id="mensajeModal" class="alert d-none" role="alert"></div>

                    <form id="formModificar" novalidate>
                        <div class="row g-4">

                            <div class="col-12 col-lg-8">
                                <div class="row g-3">

                                    <div class="col-12 col-md-8">
                                        <label for="puesto" class="form-label">Puesto</label>
                                        <input type="text" class="form-control" id="puesto" maxlength="100" required>
                                    </div>

                                    <!-- Solo el administrador cambia el estado, a mano -->
                                    <div class="col-12 col-md-4">
                                        <label for="estado" class="form-label">Estado</label>
                                        <select class="form-select" id="estado" required>
                                            <option value="Activa">Activa</option>
                                            <option value="En Proceso">En Proceso</option>
                                            <option value="Finalizada">Finalizada</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-text mt-0">Solo las ofertas en estado <strong>Activa</strong>
                                            reciben postulaciones. El estado cambia únicamente desde aquí.</div>
                                    </div>

                                    <div class="col-6 col-md-3">
                                        <label for="sueldo" class="form-label">Sueldo (S/)</label>
                                        <input type="number" class="form-control" id="sueldo" min="0.01"
                                            max="99999999.99" step="0.01" required>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <label for="frecuenciaPagos" class="form-label">Frecuencia de pagos</label>
                                        <select class="form-select" id="frecuenciaPagos" required>
                                            <option value="Semanal">Semanal</option>
                                            <option value="Quincenal">Quincenal</option>
                                            <option value="Mensual">Mensual</option>
                                        </select>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <label for="bonos" class="form-label">Bonos (S/)</label>
                                        <input type="number" class="form-control" id="bonos" min="0"
                                            max="99999999.99" step="0.01">
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <label for="horas" class="form-label">Horas semanales</label>
                                        <input type="number" class="form-control" id="horas" min="1" max="168"
                                            step="1" required>
                                    </div>

                                    <div class="col-6 col-md-3">
                                        <label for="vacaciones" class="form-label">Vacaciones (días)</label>
                                        <input type="number" class="form-control" id="vacaciones" min="0" max="365"
                                            step="1" required>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <label for="seguroVida" class="form-label">Seguro de vida</label>
                                        <select class="form-select" id="seguroVida" required>
                                            <option value="Sí">Sí</option>
                                            <option value="No">No</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="gratificaciones" class="form-label">Gratificaciones <span
                                                class="text-muted">(opcional)</span></label>
                                        <input type="text" class="form-control" id="gratificaciones" maxlength="100">
                                    </div>

                                    <div class="col-12">
                                        <label for="otros" class="form-label">Otros beneficios <span
                                                class="text-muted">(opcional)</span></label>
                                        <input type="text" class="form-control" id="otros" maxlength="255">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label for="fechaInicio" class="form-label">Fecha de inicio</label>
                                        <input type="date" class="form-control" id="fechaInicio" required>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="fechaFin" class="form-label">Fecha de fin</label>
                                        <input type="date" class="form-control" id="fechaFin" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Requisitos -->
                            <div class="col-12 col-lg-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="form-label mb-0">Requisitos</span>
                                    <span class="badge bg-custom-primary" id="totalSeleccionados">0</span>
                                </div>
                                <div class="border rounded p-3 bg-light overflow-auto" style="max-height: 340px;">
                                    <div class="d-flex flex-column gap-2" id="listaRequisitos">
                                        <span class="text-secondary">Cargando requisitos...</span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formModificar" class="btn btn-custom-primary"
                        id="btnGuardar">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="controlador/app.js"></script>
    <script src="controlador/mis_vacantes.js"></script>
</body>

</html>
