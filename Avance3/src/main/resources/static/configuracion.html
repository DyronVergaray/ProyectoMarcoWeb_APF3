<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="vista/theme.css" rel="stylesheet">
</head>

<body class="d-flex flex-column vh-100">

    <header id="navbar-contenedor"></header>

    <div class="d-flex flex-nowrap flex-grow-1 overflow-hidden">

        <div id="sidebar-contenedor"></div>

        <main class="flex-grow-1 p-4 overflow-auto">

            <div class="card shadow-sm border-0 rounded-4 mx-auto" style="max-width: 700px;">
                <div class="card-body p-4">

                    <h4 class="fw-bold mb-4">Configuración de la Empresa</h4>

                    <div id="mensaje" class="alert d-none" role="alert"></div>

                    <form id="formConfiguracion" novalidate>

                        <h6 class="fw-bold mb-3 text-custom-primary">Datos de la empresa</h6>

                        <div class="mb-3">
                            <p class="mb-1 fw-bold">Nombre de la empresa</p>
                            <div class="input-group">
                                <input type="text" class="form-control campo-editable" id="nombreEmpresa"
                                    maxlength="150" disabled>
                                <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <p class="mb-1 fw-bold">Rubro / Industria</p>
                            <div class="input-group">
                                <input type="text" class="form-control campo-editable" id="rubro" maxlength="100"
                                    disabled>
                                <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <p class="mb-1 fw-bold">RUC</p>
                            <div class="input-group">
                                <input type="text" class="form-control campo-editable" id="ruc" maxlength="11"
                                    inputmode="numeric" disabled>
                                <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                            </div>
                        </div>

                        <hr class="my-4">
                        <h6 class="fw-bold mb-3 text-custom-primary">Contacto de la empresa</h6>

                        <div class="mb-3">
                            <p class="mb-1 fw-bold">Teléfono</p>
                            <div class="input-group">
                                <input type="tel" class="form-control campo-editable" id="telefono" maxlength="15"
                                    inputmode="numeric" disabled>
                                <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <p class="mb-1 fw-bold">Correo empresarial</p>
                            <div class="input-group">
                                <input type="email" class="form-control campo-editable" id="correoEmpresarial"
                                    maxlength="150" disabled>
                                <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <p class="mb-1 fw-bold">Redes sociales <span class="text-muted fw-normal">(opcional)</span></p>
                            <div class="input-group">
                                <input type="text" class="form-control campo-editable" id="redesSociales"
                                    maxlength="255" placeholder="Enlace o usuario de tus redes" disabled>
                                <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-custom-primary w-100 py-2 fw-medium"
                            id="btnGuardar">Guardar cambios</button>
                    </form>

                </div>
            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="controlador/app.js"></script>
    <script src="controlador/configuracion.js"></script>
</body>

</html>
